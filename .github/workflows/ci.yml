name: CI

on:
  push:
    branches: [main, develop, e2e-against-conductor-with-local-script] # TODO: Remove e2e-against-conductor-with-local-script branch after merging
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      oss_conductor_version:
        description: 'OSS Conductor image tag (falls back to the E2E_TEST_OSS_CONDUCTOR_VERSION org var, then to the default in scripts/docker-compose-oss.yaml on fork PRs)'
        required: false
        type: string

# Supersede an in-flight run when a new commit lands on the same ref, matching
# python-sdk and go-sdk. The integration jobs make this more than a runner-time
# saving: the cloud job mutates shared state on the sdkdev tenant (scheduler_spec
# calls pause_all_schedules/resume_all_schedules, which are not scoped to a
# test_id), so two runs of the same branch overlapping will fight each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ['3.0', '3.1', '3.2', '3.3']
        include:
          - os: macos-latest
            ruby: '3.2'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Run unit tests
        run: bundle exec rspec spec/conductor/ --format documentation

      - name: Run RuboCop
        run: bundle exec rubocop --parallel
        continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Run RuboCop
        run: bundle exec rubocop --parallel

  build:
    name: Build Gem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Build gem
        run: gem build conductor_ruby.gemspec

      - name: Upload gem artifact
        uses: actions/upload-artifact@v4
        with:
          name: gem
          path: "*.gem"

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [test, build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Run integration tests
        if: env.CONDUCTOR_SERVER_URL != ''
        env:
          CONDUCTOR_INTEGRATION: 'true'
          CONDUCTOR_SERVER_URL: ${{ vars.CONDUCTOR_SERVER_URL }}
          CONDUCTOR_AUTH_KEY: ${{ vars.CONDUCTOR_AUTH_KEY }}
          CONDUCTOR_AUTH_SECRET: ${{ secrets.CONDUCTOR_AUTH_SECRET }}
        run: |
          bundle exec rspec spec/integration/ --format documentation

  # Integration tests (OSS): spins up Conductor OSS + Postgres via
  # scripts/docker-compose-oss.yaml and runs the integration spec suite against
  # it unauthenticated. The same stack can be run locally with
  # scripts/run-integration-oss.sh. Unlike the cloud `integration-test`
  # job above, this needs no secrets, so it runs on every push/PR and is not
  # continue-on-error.
  integration-tests-oss:
    name: Integration Tests (OSS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, build]
    env:
      CONDUCTOR_SERVER_URL: http://localhost:8080/api
      CONDUCTOR_SERVER_TYPE: oss
      CONDUCTOR_INTEGRATION: 'true'
    steps:
      # OSS_CONDUCTOR_VERSION is resolved here rather than in the job `env` so
      # that the two ways it can come back empty get different treatment:
      #
      #   - Fork PR: GitHub withholds org/repo variables from pull_request runs
      #     on forks exactly as it withholds secrets, so vars.* is always "" for
      #     an outside contributor (observed in csharp-sdk#178). This job needs
      #     no secrets, only a tag, so leave the var unset and let the default
      #     baked into the `image:` line of scripts/docker-compose-oss.yaml
      #     apply. That is the same tag a plain local run of
      #     scripts/run-integration-oss.sh gets, and the one place it is
      #     written -- no second copy to drift out of sync here.
      #   - Anything else: the org variable is genuinely missing or its
      #     repository access policy no longer covers this repo. Fail loudly
      #     rather than silently drifting onto the default.
      - name: Resolve OSS Conductor version
        env:
          REQUESTED_VERSION: ${{ inputs.oss_conductor_version || vars.E2E_TEST_OSS_CONDUCTOR_VERSION }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "$REQUESTED_VERSION" ]; then
            echo "OSS_CONDUCTOR_VERSION=${REQUESTED_VERSION}" >> "$GITHUB_ENV"
          elif [ "$IS_FORK_PR" = "true" ]; then
            echo "::notice::Fork PR: org variables are withheld, falling back to the default tag in scripts/docker-compose-oss.yaml"
          else
            echo "::error::No Conductor OSS image tag resolved. Set the E2E_TEST_OSS_CONDUCTOR_VERSION organization variable (and ensure its repository access policy includes this repo), or pass the oss_conductor_version input via workflow_dispatch."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      # `docker compose up` only pulls an image when it is missing locally. On a
      # GitHub-hosted runner the VM is ephemeral and starts with no cached copy
      # of this image, so `up` would pull anyway and this step is redundant
      # today. It is here deliberately: it costs no extra network pull (`up`
      # then finds the image locally), it separates "couldn't pull the image"
      # from "the stack didn't come up" into two distinct red steps, and it is
      # what keeps a mutable tag from going stale if this job ever moves to a
      # self-hosted runner with a warm Docker daemon -- the same reason
      # scripts/run-integration-oss.sh pulls. It also prints the tag actually in
      # use, which for a fork PR comes from the compose file's default.
      - name: Pull Conductor OSS image
        run: |
          echo "Using $(docker compose -f scripts/docker-compose-oss.yaml config --images | grep -m1 '^conductoross/conductor:')"
          docker compose -f scripts/docker-compose-oss.yaml pull conductor-server

      - name: Start Conductor OSS stack
        run: docker compose -f scripts/docker-compose-oss.yaml up -d

      - name: Wait for Conductor to be healthy
        # Matches HEALTH_TIMEOUT in scripts/run-integration-oss.sh, and stays under the compose
        # healthcheck's own ~200s budget (10s x 20 retries). `curl -sf` alone is the check:
        # /health answers non-2xx while the server is still coming up.
        run: timeout 180 bash -c 'until curl -sf http://localhost:8080/health; do sleep 5; done'

      - name: Run integration tests (OSS)
        run: bundle exec rspec spec/integration/ --format documentation

      - name: Dump Conductor logs
        if: failure()
        run: docker compose -f scripts/docker-compose-oss.yaml logs conductor-server

  agents-replay:
    name: Agents replay (WireMock)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout recorded scenarios
        uses: actions/checkout@v4
        with:
          repository: conductor-oss/conductor-mocks
          ref: 3bbd213a01311d0ba69210eb8723580ba2708c02 # feature/poc_example agent recordings
          path: conductor-mocks

      - name: Start WireMock with agent/tool_happy_path
        run: |
          test -f conductor-mocks/mocks/agent/tool_happy_path/mappings/01_post_api_agent_start.json
          docker run -d --name wiremock -p 8080:8080 \
            -v "$PWD/conductor-mocks/mocks/agent/tool_happy_path:/home/wiremock" \
            wiremock/wiremock:3x
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/__admin/mappings > /dev/null && break
            sleep 1
          done

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Run agent replay specs
        env:
          CONDUCTOR_AGENTS_REPLAY_URL: http://localhost:8080
        run: bundle exec rspec spec/agents --format documentation
